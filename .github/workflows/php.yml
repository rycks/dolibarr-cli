name: PHP

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: sqlite3, pdo_sqlite, zip, mbstring, posix

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check syntax and code style
      run: make lint

    - name: Static analysis
      run: vendor/bin/phpstan analyse -c .phpstan.github.neon --memory-limit=1G --no-progress

    - name: Run test suite
      run: vendor/bin/pest

    - name: Build the phar
      run: vendor/bin/box compile
