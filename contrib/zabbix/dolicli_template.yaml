zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 2d9f684b7075a9c28afc0b59bb846393
      name: Templates/Applications
  templates:
    - uuid: 916d218d4ee22e1217702864f305744c
      template: 'Dolibarr by dolicli'
      name: 'Dolibarr by dolicli'
      description: 'Dolibarr instances monitored by dolicli: reads the state files /var/lib/dolicli/<run_as>/<instance>.json. Generated by build/generate-zabbix-template.php.'
      groups:
        - name: Templates/Applications
      discovery_rules:
        - uuid: cf5ff35b13dff66b40e64974bd25a37d
          name: 'Dolibarr instances'
          key: dolicli.discover
          delay: 1h
          lifetime: 7d
          description: 'UserParameter=dolicli.discover,<php of the instances> /usr/local/bin/dolicli monitor discover'
          item_prototypes:
            - uuid: 9b152bcdbcfcf6d4580c115127f294fe
              name: 'Dolibarr {#INSTANCE}: state file'
              key: 'vfs.file.contents[{#STATEFILE}]'
              delay: 1m
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Raw state file written by dolicli monitor collect (schema/state.schema.json).'
              tags:
                - tag: component
                  value: dolibarr
            - uuid: b6ad8ecace4b961490416985247cff7c
              name: 'Dolibarr {#INSTANCE}: status'
              type: DEPENDENT
              key: 'dolicli.status[{#INSTANCE}]'
              delay: '0'
              valuemap:
                name: 'dolicli status'
              description: 'Most serious status of the checks: 0 ok, 1 warning, 2 critical, 3 unknown.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.status'
                - type: JAVASCRIPT
                  parameters:
                    - 'return {"ok": 0, "warning": 1, "critical": 2, "unknown": 3, "skipped": 0}[value];'
              master_item:
                key: 'vfs.file.contents[{#STATEFILE}]'
              tags:
                - tag: component
                  value: dolibarr
            - uuid: f012457e6e132d549c213f4f200cab18
              name: 'Dolibarr {#INSTANCE}: collection age'
              type: DEPENDENT
              key: 'dolicli.collector.age[{#INSTANCE}]'
              delay: '0'
              units: s
              description: 'Seconds since the last write of the state file (collector.age is never stored).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.generated_at_unix'
                - type: JAVASCRIPT
                  parameters:
                    - 'return Math.floor(Date.now() / 1000) - value;'
              master_item:
                key: 'vfs.file.contents[{#STATEFILE}]'
              tags:
                - tag: component
                  value: dolibarr
            - uuid: 494080cd8ac21f3757c38e241f6952b8
              name: 'Dolibarr {#INSTANCE}: backup.age status'
              type: DEPENDENT
              key: 'dolicli.check.status[{#INSTANCE},backup.age]'
              delay: '0'
              valuemap:
                name: 'dolicli status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.checks["backup.age"].status'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'unknown'
                - type: JAVASCRIPT
                  parameters:
                    - 'return {"ok": 0, "warning": 1, "critical": 2, "unknown": 3, "skipped": 0}[value];'
              master_item:
                key: 'vfs.file.contents[{#STATEFILE}]'
              tags:
                - tag: component
                  value: dolibarr
            - uuid: 4dd16daee58603bf17b72b9f7ad9c987
              name: 'Dolibarr {#INSTANCE}: backup.age'
              type: DEPENDENT
              key: 'dolicli.check.value[{#INSTANCE},backup.age]'
              delay: '0'
              units: s
              value_type: FLOAT
              description: 'Age of the most recent backup.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.checks["backup.age"].value'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - 'if (value === ''null'' || value === '''') { throw ''no value''; } return value === ''true'' ? 1 : (value === ''false'' ? 0 : value);'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vfs.file.contents[{#STATEFILE}]'
              tags:
